[project]
name = "portaldot-pdk"
version = "0.2.0"
description = "Portaldot Dev Kit — Python CLI that decodes failed Portaldot transactions into named errors and fix steps. See also `pdk-ts`, the TypeScript companion with the same command surface."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pugar Huda Mantoro" }]
keywords = ["portaldot", "substrate", "blockchain", "cli", "developer-tools", "debugging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "typer>=0.26.8",
    "rich>=15.0.0",
    "substrate-interface>=1.8.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
pdk = "pdk.cli:main"

[project.urls]
Homepage = "https://portaldot-pdk.vercel.app"
Repository = "https://github.com/PugarHuda/portaldot-dev-kit"
Changelog = "https://github.com/PugarHuda/portaldot-dev-kit/blob/master/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pdk"]

# Without an explicit list, the sdist swept in the whole working tree —
# `site/node_modules`, `site/.next`, `remotion/public`, and every demo
# video, for a 72 MB upload of which none is source. An sdist is meant to
# be the source needed to rebuild the wheel and run the tests; name that
# exactly rather than excluding bloat one directory at a time, which
# silently re-breaks the moment a new asset folder appears.
[tool.hatch.build.targets.sdist]
include = [
    "/pdk",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/NOTICE",
]
